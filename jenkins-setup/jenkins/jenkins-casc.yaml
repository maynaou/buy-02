jenkins:
  systemMessage: "Jenkins configuré via JCasC — MR-Jenk pipeline"
  numExecutors: 2

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "github-creds"
              username: "${GITHUB_USERNAME}"
              password: "${GITHUB_TOKEN}"
              description: "GitHub username + Personal Access Token"

          - usernamePassword:
              scope: GLOBAL
              id: "gmail-smtp-creds"
              username: "${GMAIL_USERNAME}"
              password: "${GMAIL_APP_PASSWORD}"
              description: "Gmail SMTP credentials pour emailext"

          - usernamePassword:
              scope: GLOBAL
              id: "mongo-creds"
              username: "${MONGO_USERNAME}"
              password: "${MONGO_PASSWORD}"
              description: "MongoDB root credentials"

          - usernamePassword:
              scope: GLOBAL
              id: "nexus-credentials"
              username: "${NEXUS_USERNAME}"
              password: "${NEXUS_PASSWORD}"
              description: "Compte de publication Nexus"

          - string:
              scope: GLOBAL
              id: "ssl-password"
              secret: "${SSL_PASSWORD}"
              description: "Mot de passe du certificat SSL Angular/API Gateway"

          - string:
              scope: GLOBAL
              id: "cloudinary-url"
              secret: "${CLOUDINARY_URL}"
              description: "URL Cloudinary pour media-service"

          - string:
              scope: GLOBAL
              id: "sonar-token"
              secret: "${SONAR_TOKEN}"
              description: "Token d'authentification SonarQube (généré manuellement dans l'UI Sonar)"

          - file:
              scope: GLOBAL
              id: "jwt-private-key"
              fileName: "pri.pem"
              secretBytes: "${JWT_PRIVATE_KEY_B64}"
              description: "Clé privée JWT (RS256)"

          - file:
              scope: GLOBAL
              id: "jwt-public-key"
              fileName: "pub.pem"
              secretBytes: "${JWT_PUBLIC_KEY_B64}"
              description: "Clé publique JWT (RS256)"
          - file:
              scope: GLOBAL
              id: "frontend-ssl-cert"
              fileName: "nginx.crt"
              secretBytes: "${FRONTEND_SSL_CERT_B64}"
              description: "Certificat SSL du frontend"

          - file:
              scope: GLOBAL
              id: "frontend-ssl-key"
              fileName: "nginx.key"
              secretBytes: "${FRONTEND_SSL_KEY_B64}"
              description: "Clé privée SSL du frontend"
              

unclassified:

  location:
    url: "http://localhost:8080/"
    adminAddress: "${GMAIL_USERNAME}"

  extendedEmailPublisher:
    defaultSuffix: "@gmail.com"
    defaultContentType: "text/plain"
    defaultSubject: '$PROJECT_NAME - Build # $BUILD_NUMBER - $BUILD_STATUS!'
    defaultBody: |
      $PROJECT_NAME - Build # $BUILD_NUMBER - $BUILD_STATUS:

      Check console output at $BUILD_URL to view the results.
    mailAccount:
      smtpHost: "smtp.gmail.com"
      smtpPort: 587
      useTls: true
      credentialsId: "gmail-smtp-creds"

  sonarglobalconfiguration:
    buildWrapperEnabled: false
    installations:
      - name: "SonarQube"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonar-token"

jobs:
  - script: >
      multibranchPipelineJob('buy-01-pipeline') {
        branchSources {
          branchSource {
            source {
              github {
                id('buy-01-github-source')
                repoOwner('maynaou')
                repository('buy-01')
                repositoryUrl('https://github.com/maynaou/buy-01')
                configuredByUrl(false)
                credentialsId('github-creds')

                traits {
                  gitHubBranchDiscovery {
                    strategyId(3)
                  }
                  gitHubPullRequestDiscovery {
                    strategyId(1)
                  }
                }
              }
            }
          }
        }

        orphanedItemStrategy {
          discardOldItems {
            numToKeep(20)
          }
        }

        triggers {
          periodicFolderTrigger {
            interval('1m')
          }
        }

        factory {
          workflowBranchProjectFactory {
            scriptPath('Jenkinsfile')
          }
        }
      }